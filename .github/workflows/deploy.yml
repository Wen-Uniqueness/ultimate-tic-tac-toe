name: Deploy Godot Web Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    name: Export Godot Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot 4.7 and Web export templates
        shell: bash
        run: |
          set -euo pipefail

          GODOT_VERSION="4.7-stable"
          GODOT_DIR="$RUNNER_TEMP/godot"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.stable"

          mkdir -p "$GODOT_DIR" "$TEMPLATE_DIR"

          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/export_templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/export_templates.tpz" -d "$RUNNER_TEMP/export_templates"
          cp -R "$RUNNER_TEMP/export_templates/templates/." "$TEMPLATE_DIR/"

          echo "$GODOT_DIR" >> "$GITHUB_PATH"

      - name: Create export directory
        run: mkdir -p build/web

      - name: Export Web version
        run: godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: export

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
